<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mail</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFEBD0">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mail">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #f0f0f0; display: flex; justify-content: center; }
#app { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; background: #FFEBD0; display: flex; flex-direction: column; overflow: hidden; position: relative; }

/* INBOX VIEW */
#inbox-view { display: flex; flex-direction: column; height: 100%; position: relative; }
.inbox-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px 10px; background: #FFEBD0; }
.menu-btn, .icon-btn-plain { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
.search-pill { flex: 1; background: #fff; border-radius: 26px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.search-pill span { color: #777; font-size: 15px; flex: 1; }
.account-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0; }

.tabs-row { display: flex; gap: 10px; padding: 6px 16px 12px; }
.current-tab-label { font-size: 14px; font-weight: 700; color: #1a73e8; }

.mail-list { flex: 1; overflow-y: auto; background: #FFEBD0; padding-bottom: 56px; }
.mail-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: #FFF8F3; border-bottom: 1px solid rgba(0,0,0,0.06); cursor: pointer; transition: background 0.1s; }
.mail-row:active { background: #f5f5f5; }
.mail-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0; }
.mail-body { flex: 1; min-width: 0; }
.mail-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mail-sender { font-size: 14.5px; color: #444; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-row.unread .mail-sender { color: #111; font-weight: 700; }
.mail-date { font-size: 12px; color: #777; flex-shrink: 0; }
.mail-row.unread .mail-date { color: #111; font-weight: 700; }
.mail-subject-line { font-size: 13.5px; color: #555; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.mail-row.unread .mail-subject-line { color: #111; }
.mail-subject-line .subj { font-weight: 600; }
.mail-row.unread .mail-subject-line .subj { font-weight: 700; }
.mail-snippet { color: #777; font-weight: 400; }
.star-btn { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; align-self: center; }

.compose-fab { position: absolute; right: 18px; bottom: 80px; background: #FF7A00; color: #fff; border: none; border-radius: 28px; padding: 16px 24px 16px 18px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(255,122,0,0.4); }

.bottom-tabs { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: #FFF8F0; border-top: 1px solid #e7e0cf; display: flex; align-items: center; justify-content: space-around; z-index: 20; }
.tab-btn { flex: 1; height: 100%; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tab-icon-circle { width: 40px; height: 32px; border-radius: 16px; background: #E8EAF6; display: flex; align-items: center; justify-content: center; }

/* DETAIL VIEW */
#detail-view { display: none; flex-direction: column; height: 100%; background: #FFF8F0; }
.detail-header { display: flex; align-items: center; gap: 22px; padding: 12px 14px; background: #FFEBD0; position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
.detail-header .spacer { flex: 1; }
.detail-subject-block { padding: 12px 0 10px; text-align: left; }
.detail-subject-text { font-size: 20px; font-weight: 400; color: #202124; line-height: 1.6; }
.inbox-badge { display: inline-block; vertical-align: middle; background: #FF7A00; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 10px; white-space: nowrap; margin-left: 10px; }
.detail-title-star { background: none; border: none; cursor: pointer; padding: 2px; display: inline-flex; vertical-align: middle; margin-left: 10px; }
.detail-meta-row { display: flex; align-items: flex-start; gap: 12px; padding: 4px 16px 8px; }
.detail-to-line { font-size: 12px; color: #5f6368; margin-top: 2px; }
.sender-card-icons { display: flex; gap: 2px; margin-left: auto; flex-shrink: 0; }
.mini-icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 6px; border-radius: 8px; color: #5f6368; }
.mini-icon-btn:active { background: rgba(0,0,0,0.06); }
.to-line-toggle { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
.to-arrow { font-size: 9px; }
.sender-detail-panel { display: none; margin: 8px 16px; background: #FAE8CC; border-radius: 12px; padding: 14px 20px; font-size: 14px; color: #444; }
.sender-detail-panel.open { display: block; }
.sender-detail-panel .panel-row { display: flex; gap: 8px; padding: 3px 0; line-height: 1.6; overflow-x: auto; }
.sender-detail-panel .panel-row > span:last-child { white-space: nowrap; }
.sender-detail-panel .panel-label { color: #5f6368; flex-shrink: 0; min-width: 48px; }
.security-notice { display: flex; align-items: flex-start; gap: 8px; margin-top: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); line-height: 1.6; }
.security-link { color: #FF7A00; font-weight: 600; cursor: pointer; }
.detail-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 17px; flex-shrink: 0; }
.detail-sender-info { flex: 1; min-width: 0; }
.detail-sender-name { font-size: 14px; font-weight: 600; color: #202124; line-height: 1.3; }
.detail-body-area { flex: 1; overflow-y: auto; padding: 60px 16px 160px; }
.detail-body-text { font-size: 15px; line-height: 1.6; color: #202124; white-space: pre-wrap; padding-left: 16px; }
.thread-date-inline { font-weight: 400; color: #5f6368; font-size: 12px; margin-left: 6px; }
.thread-card { background: #fff; border-radius: 4px; margin: 0 -16px 2px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.thread-card.collapsed { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.thread-card.collapsed .detail-avatar { width: 46px; height: 46px; font-size: 20px; }
.thread-card-collapsed-info { flex: 1; min-width: 0; }
.thread-card-row1 { display: flex; align-items: baseline; gap: 8px; }
.thread-card-name { font-size: 14px; font-weight: 600; color: #202124; }
.thread-card-date { font-size: 11.5px; color: #5f6368; margin-left: auto; flex-shrink: 0; }
.thread-card-preview { font-size: 13px; color: #5f4c3b; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; margin-top: 2px; }
.thread-card.expanded { padding: 14px 16px 18px; }
.thread-card.expanded .detail-meta-row { padding: 0 0 4px; cursor: pointer; }
.thread-card.expanded .detail-body-text { margin-top: 4px; }
.thread-card.expanded .sender-detail-panel { margin: 8px 0; }
.quote-block { margin-top: 18px; padding-top: 14px; padding-left: 16px; border-top: 1px solid #ecdfc8; font-size: 13px; color: #5f6368; line-height: 1.6; }
.quote-meta { margin-bottom: 6px; }
.quote-link { color: #1a73e8; cursor: pointer; }
.attachment-card { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 14px 16px; background: #fff; border: 1px solid #dadce0; border-radius: 10px; max-width: 320px; white-space: normal; }
.attachment-thumb { width: 52px; height: 64px; flex-shrink: 0; background: #fff; border: 1px solid #e0a0a0; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; }
.attachment-thumb .label { font-size: 10px; color: #d33; font-weight: 700; }
.attachment-thumb .amount { font-size: 9.5px; color: #333; font-weight: 700; text-align: center; line-height: 1.3; }
.attachment-info { min-width: 0; }
.attachment-name { font-size: 13.5px; color: #202124; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-meta { font-size: 12px; color: #5f6368; margin-top: 3px; }
.detail-actions { position: fixed; left: 0; right: 0; bottom: 56px; padding: 12px 16px; background: #FFF8F0; border-top: 1px solid #ecdfc8; display: flex; align-items: center; gap: 10px; z-index: 15; }
.detail-action-btn { flex: 1; background: #607D8B; border: none; height: 44px; border-radius: 22px; margin: 0 8px; font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.detail-emoji-btn { width: 48px; height: 48px; flex-shrink: 0; background: #fff; border: 1.5px solid #c9b89a; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>

    </button>

  <div class="detail-body-area" id="detail-body-area">

  <div class="detail-actions">
    <button class="detail-action-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>

<div class="bottom-tabs">

  </button>
</div>

</div>

function initial(name) {
  return name.trim().charAt(0);
}

function starSVG(filled) {
  return filled
    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="#F4B400" stroke="#F4B400" stroke-width="1.5"><polygon points="12 2 15 9 22 9.3 16.7 14 18.5 21 12 17 5.5 21 7.3 14 2 9.3 9 9"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.8"><polygon points="12 2 15 9 22 9.3 16.7 14 18.5 21 12 17 5.5 21 7.3 14 2 9.3 9 9"/></svg>`;
}

function renderToLine(uid) {
  return `
    <div class="detail-to-line to-line-toggle" data-to-toggle="${uid}">
      <span>To: 自分</span><span class="to-arrow">▼</span>
    </div>
  `;
}

function renderToPanel(uid, from, fromEmail, toName, toEmail, datetime) {
  return `
    <div class="sender-detail-panel" data-to-panel="${uid}">
      <div class="panel-row"><span class="panel-label">From:</span><span style="font-size: 11px;">${from}・${fromEmail}</span></div>
      <div class="panel-row"><span class="panel-label">宛先:</span><span>${toName}・${toEmail}</span></div>
      <div class="panel-row"><span class="panel-label">日付:</span><span>${datetime}</span></div>
      <div class="security-notice">
        <span>🔒</span>
        <span>標準的な暗号化（TLS）が適用されています。<br><span class="security-link">セキュリティの詳細を表示</span></span>
      </div>
    </div>
  `;
}

function renderSenderCardIcons() {
  return `
    <div class="sender-card-icons">
      <button class="mini-icon-btn" aria-label="リアクション" onclick="alert('リアクションを送信（デモ）')">😊</button>
      <button class="mini-icon-btn" aria-label="返信" onclick="alert('返信（デモ）')">↩</button>
      <button class="mini-icon-btn" aria-label="その他" onclick="alert('その他のオプション（デモ）')">⋮</button>
    </div>
  `;
}

function bindToPanelToggles(area) {
  area.querySelectorAll('[data-to-toggle]').forEach((toggle) => {
    toggle.addEventListener('click', () => {
      const id = toggle.getAttribute('data-to-toggle');
      const panel = area.querySelector(`[data-to-panel="${id}"]`);
      const arrow = toggle.querySelector('.to-arrow');
      const isOpen = panel.classList.toggle('open');
      arrow.textContent = isOpen ? '▲' : '▼';
    });
  });
}

function renderAttachment(att) {
  return `
    <div class="attachment-card">
      <div class="attachment-thumb">
        <span class="label">請求書</span>
        <span class="amount">¥${att.amount}</span>
      </div>
      <div class="attachment-info">
        <div class="attachment-name">${att.name}</div>
        <div class="attachment-meta">PDF・${att.size}</div>
      </div>
    </div>
  `;
}

function renderList() {
  const list = document.getElementById('mail-list');
  list.innerHTML = MAILS.map((m) => `
    <div class="mail-row ${m.unread ? 'unread' : ''}" data-id="${m.id}">
      <div class="mail-avatar" style="background:${colorFor(m.name)};">${initial(m.name)}</div>
      <div class="mail-body">
        <div class="mail-top-row">
          <span class="mail-sender">${m.name}</span>
          <span class="mail-date">${m.date}</span>
        </div>
        <div class="mail-subject-line"><span class="subj">${m.subject}</span> <span class="mail-snippet">- ${m.snippet}</span></div>
      </div>
      <button class="star-btn" data-star="${m.id}">${starSVG(m.starred)}</button>
    </div>
  `).join('');

  list.querySelectorAll('.mail-row').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.star-btn')) return;
      openDetail(row.getAttribute('data-id'));
    });
  });
  list.querySelectorAll('.star-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-star');
      const mail = MAILS.find((x) => x.id === id);
      mail.starred = !mail.starred;
      btn.innerHTML = starSVG(mail.starred);
    });
  });
}

function previewText(body) {
  return body.replace(/\s+/g, ' ').trim().slice(0, 60);
}

function renderQuoteBlock(prevMsg) {
  return `
    <div class="quote-block">
      <div class="quote-meta">On ${prevMsg.datetime}, ${prevMsg.from} wrote:</div>
      <span class="quote-link">元のメッセージを表示</span>
    </div>
  `;
}

function renderThreadCard(mail, msg, idx, expanded) {
  const uid = `${mail.id}-${idx}`;
  if (!expanded) {
    return `
      <div class="thread-card collapsed" data-card-toggle="${idx}">
        <div class="detail-avatar" style="background:${colorFor(msg.from)};">${initial(msg.from)}</div>
        <div class="thread-card-collapsed-info">
          <div class="thread-card-row1">
            <span class="thread-card-name">${msg.from}</span>
            <span class="thread-card-date">${msg.date}</span>
          </div>
          <div class="thread-card-preview">${previewText(msg.body)}</div>
        </div>
      </div>
    `;
  }
  const messages = mail._messages;
  const quoteHTML = idx > 0 ? renderQuoteBlock(messages[idx - 1]) : '';
  return `
    <div class="thread-card expanded">
      <div class="detail-meta-row" data-card-toggle="${idx}">
        <div class="detail-avatar" style="background:${colorFor(msg.from)};">${initial(msg.from)}</div>
        <div class="detail-sender-info">
          <div class="detail-sender-name">${msg.from} <span class="thread-date-inline">${msg.date}</span></div>
          ${renderToLine(uid)}
        </div>
        ${renderSenderCardIcons()}
      </div>
      ${renderToPanel(uid, msg.from, msg.fromEmail, msg.to, msg.toEmail, msg.datetime)}
      <div class="detail-body-text">${msg.body}${msg.attachment ? renderAttachment(msg.attachment) : ''}</div>
      ${quoteHTML}
    </div>
  `;
}

function bindThreadCardToggles(area, mail) {
  area.querySelectorAll('[data-card-toggle]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-to-toggle]') || e.target.closest('.sender-card-icons') || e.target.closest('.detail-title-star')) return;
      const idx = Number(el.getAttribute('data-card-toggle'));
      const scrollPos = area.scrollTop;
      mail._expanded[idx] = !mail._expanded[idx];
      renderDetailBody(mail);
      area.scrollTop = scrollPos;
    });
  });
}

function renderDetailBody(mail) {
  const area = document.getElementById('detail-body-area');
  const messages = mail._messages;

  const subjectRowHTML = `
    <div class="detail-subject-block">
      <span class="detail-subject-text">${mail.subject}</span>
      <span class="inbox-badge">受信トレイ</span>
      <button class="detail-title-star" data-star="${mail.id}">${starSVG(mail.starred)}</button>
    </div>
  `;

  const cardsHTML = messages.map((msg, i) => renderThreadCard(mail, msg, i, mail._expanded[i])).join('');

  area.innerHTML = `${subjectRowHTML}${cardsHTML}`;

  bindToPanelToggles(area);
  bindThreadCardToggles(area, mail);

  const titleStarBtn = area.querySelector('.detail-title-star');
  if (titleStarBtn) {
    titleStarBtn.addEventListener('click', () => {
      mail.starred = !mail.starred;
      titleStarBtn.innerHTML = starSVG(mail.starred);
    });
  }
}

function openDetail(id) {
  const mail = MAILS.find((x) => x.id === id);
  if (!mail) return;
  mail.unread = false;

  if (!mail._messages) {
    mail._messages = mail.thread || [{
      from: mail.name, fromEmail: mail.email, to: '野口', toEmail: MY_EMAIL,
      date: mail.date, datetime: mail.date, body: mail.body,
    }];
  }
  if (!mail._expanded) {
    mail._expanded = mail._messages.map((_, i) => i === mail._messages.length - 1);
  }

  renderDetailBody(mail);
  document.getElementById('detail-body-area').scrollTop = 0;

  document.getElementById('inbox-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'flex';
  renderList();
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('inbox-view').style.display = 'flex';
  renderList();
}

renderList();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      reg.update();
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            window.location.reload();
          }
        });
      });
    }).catch((err) => {
      console.error('Service worker registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
