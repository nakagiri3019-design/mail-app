<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #FFF4E3; display: flex; justify-content: center; }
#app { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; background: #FFF4E3; display: flex; flex-direction: column; overflow: hidden; position: relative; }

/* INBOX VIEW */
#inbox-view { display: flex; flex-direction: column; height: 100%; position: relative; }
.inbox-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px 10px; background: #FFF4E3; }
.menu-btn, .icon-btn-plain { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
.search-pill { flex: 1; background: #fff; border-radius: 26px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.search-pill span { color: #6B5A45; font-size: 15px; flex: 1; }
.account-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0; }

.tabs-row { display: flex; gap: 10px; padding: 6px 16px 12px; }
.current-tab-label { font-size: 14px; font-weight: 700; color: #1a73e8; }

.mail-list { flex: 1; overflow-y: auto; background: #FFF4E3; padding: 8px 12px 72px; display: flex; flex-direction: column; gap: 8px; }
.mail-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: #FFFDF9; border-radius: 16px; box-shadow: none; cursor: pointer; transition: background 0.1s; }
.mail-row:active { background: #f5f5f5; }
.mail-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; flex-shrink: 0; }
.mail-body { flex: 1; min-width: 0; }
.mail-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mail-sender { font-size: 14.5px; font-weight: 700; color: #3B2A12; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-row.unread .mail-sender { color: #3B2A12; font-weight: 700; }
.mail-date { font-size: 12px; color: #6B5A45; flex-shrink: 0; }
.mail-row.unread .mail-date { color: #3B2A12; font-weight: 700; }
.mail-subject-line { font-size: 13.5px; color: #6B5A45; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.mail-row.unread .mail-subject-line { color: #3B2A12; }
.mail-subject-line .subj { font-weight: 600; }
.mail-row.unread .mail-subject-line .subj { font-weight: 700; }
.mail-snippet { color: #6B5A45; font-weight: 400; }
.star-btn { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; align-self: center; }

.compose-fab { position: absolute; right: 18px; bottom: 80px; background: #FF7A00; color: #fff; border: none; border-radius: 28px; padding: 16px 24px 16px 18px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(255,122,0,0.4); }

.bottom-tabs { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding: 4px 0 2px; background: #FFF4E3; border-top: 1px solid rgba(0,0,0,0.07); display: flex; align-items: center; justify-content: space-around; box-sizing: border-box; z-index: 20; }
.tab-btn { flex: 1; height: 100%; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tab-icon-circle { width: 64px; height: 32px; border-radius: 16px; background: #E8EAF6; display: flex; align-items: center; justify-content: center; }

/* DETAIL VIEW */
#detail-view { display: none; flex-direction: column; height: 100%; background: #FFF4E3; }
.detail-header { display: flex; align-items: center; gap: 22px; padding: 12px 14px; background: #FFF4E3; position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
.detail-header .spacer { flex: 1; }
.detail-subject-block { padding: 12px 0 4px; text-align: left; }
.detail-subject-text { font-size: 21px; font-weight: 400; color: #3B2A12; line-height: 1.6; }
.inbox-badge { display: inline-block; vertical-align: middle; background: #FF7A00; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 10px; white-space: nowrap; margin-left: 10px; }
.detail-title-star { background: none; border: none; cursor: pointer; padding: 2px; display: inline-flex; vertical-align: middle; margin-left: 10px; }
.detail-meta-row { display: flex; align-items: flex-start; gap: 12px; padding: 4px 16px 8px; }
.detail-to-line { font-size: 12px; color: #6B5A45; margin-top: 2px; }
.sender-card-icons { display: flex; gap: 2px; margin-left: auto; flex-shrink: 0; }
.mini-icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 6px; border-radius: 8px; color: #6B5A45; }
.mini-icon-btn:active { background: rgba(0,0,0,0.06); }
.to-line-toggle { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
.to-arrow { font-size: 9px; }
.sender-detail-panel { display: none; margin: 12px 8px; background: #FAE8CC; border-radius: 10px; padding: 14px 20px; font-size: 15px; line-height: 1.6; color: #6B5A45; }
.sender-detail-panel.open { display: block; }
.sender-detail-panel .panel-row { display: flex; gap: 8px; padding: 4px 0; line-height: 1.6; overflow-x: auto; }
.sender-detail-panel .panel-row > span:last-child { white-space: nowrap; font-size: 15px; color: #3B2A12; }
.sender-detail-panel .panel-label { font-size: 14px; color: #6B5A45; flex-shrink: 0; min-width: 48px; }
.security-notice { display: flex; align-items: flex-start; gap: 8px; margin-top: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); font-size: 15px; line-height: 1.6; }
.security-link { color: #FF7A00; font-size: 15px; font-weight: 600; cursor: pointer; }
.detail-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; flex-shrink: 0; }
.detail-sender-info { flex: 1; min-width: 0; }
.detail-sender-name { font-size: 14px; font-weight: 600; color: #3B2A12; line-height: 1.3; }
.detail-body-area { flex: 1; overflow-y: auto; padding: 60px 16px 160px; }
.detail-body-text { font-size: 16px; line-height: 1.6; color: #3B2A12; white-space: pre-wrap; padding-left: 16px; }
.thread-date-inline { font-weight: 400; color: #6B5A45; font-size: 12px; margin-left: 6px; }
.thread-card { background: #FFFDF9; border-radius: 6px; margin: 0 4px 2px; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); box-shadow: none; }
.thread-card.collapsed { min-height: 92px; padding: 16px 12px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.thread-card .detail-avatar { width: 40px; height: 40px; font-size: 15px; }
.thread-card-collapsed-info { flex: 1; min-width: 0; }
.thread-card-name { font-size: 15px; font-weight: 600; color: #3B2A12; }
.thread-card-date { font-size: 11.5px; color: #6B5A45; margin-left: 6px; }
.thread-card-preview { font-size: 13px; font-weight: 400; color: #7A6A55; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; white-space: normal; margin-top: 4px; line-height: 1.45; }
.thread-card.expanded { padding: 14px 16px 18px; }
.thread-card.expanded .detail-meta-row { padding: 12px 0 4px; cursor: pointer; }
.thread-card.expanded .detail-body-text { margin-top: 12px; }
.thread-card.expanded .sender-detail-panel { margin: 12px 8px; }
.quote-block { margin-top: 18px; padding-top: 14px; padding-left: 16px; border-top: 1px solid rgba(0,0,0,0.07); font-size: 13px; color: #6B5A45; line-height: 1.6; }
.quote-meta { margin-bottom: 6px; }
.quote-link { color: #1a73e8; cursor: pointer; }
.attachment-card { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 16px; background: #FAE8CC; border-radius: 12px; max-width: 320px; white-space: normal; cursor: pointer; }
.attachment-icon { width: 40px; height: 40px; flex-shrink: 0; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.attachment-info { min-width: 0; }
.attachment-name { font-size: 13.5px; color: #3B2A12; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-meta { font-size: 12px; color: #6B5A45; margin-top: 3px; }
.detail-actions { position: fixed; left: 0; right: 0; bottom: 56px; padding: 12px 16px; background: #FFF4E3; border-top: 1px solid rgba(0,0,0,0.07); display: flex; align-items: center; gap: 4px; z-index: 15; }
.detail-action-btn { flex: 1; background: #5D6A8A; border: none; height: 44px; border-radius: 22px; margin: 0 4px; font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.detail-emoji-btn { width: 48px; height: 48px; flex-shrink: 0; background: #fff; border: 1.5px solid rgba(0,0,0,0.12); border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.summary-card { display: flex; align-items: center; gap: 10px; margin: 6px 4px 10px; padding: 12px 14px; background: #FFFDF9; border-radius: 12px; border: 1px solid rgba(0,0,0,0.05); cursor: pointer; }
.summary-card.hidden { display: none; }
.summary-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #6B5A45; }
.summary-label { flex: 1; font-size: 13.5px; color: #3B2A12; font-weight: 500; }
.summary-dismiss { background: none; border: none; cursor: pointer; padding: 4px 6px; color: #aaa; font-size: 18px; line-height: 1; flex-shrink: 0; }

function initial(name) {
  return name.trim().charAt(0);
}

const AVATAR_LABEL_OVERRIDES = {
  '武田': '武田',
  '中桐': '中桐',
};

function avatarLabel(name) {
  return AVATAR_LABEL_OVERRIDES[name] || initial(name);
}

function renderDetailAvatar(name) {
  const label = avatarLabel(name);
  const fontSize = label.length > 1 ? 'font-size:11px;' : '';
  return `<div class="detail-avatar" style="background:${colorFor(name)};${fontSize}">${label}</div>`;
}

function starSVG(filled) {
  return filled
    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="#F4B400" stroke="#F4B400" stroke-width="1.5"><polygon points="12 2 15 9 22 9.3 16.7 14 18.5 21 12 17 5.5 21 7.3 14 2 9.3 9 9"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.8"><polygon points="12 2 15 9 22 9.3 16.7 14 18.5 21 12 17 5.5 21 7.3 14 2 9.3 9 9"/></svg>`;
}

function renderToLine(uid) {
  return `
    <div class="detail-to-line to-line-toggle" data-to-toggle="${uid}">
      <span>To: 自分</span><span class="to-arrow">▼</span>

function bindToPanelToggles(area) {
  area.querySelectorAll('[data-to-toggle]').forEach((toggle) => {
    toggle.addEventListener('click', () => {
      const id = toggle.getAttribute('data-to-toggle');
      const panel = area.querySelector(`[data-to-panel="${id}"]`);
      const arrow = toggle.querySelector('.to-arrow');
      const isOpen = panel.classList.toggle('open');
      arrow.textContent = isOpen ? '▲' : '▼';
    });
  });
}

      const mail = MAILS.find((x) => x.id === id);
      mail.starred = !mail.starred;
      btn.innerHTML = starSVG(mail.starred);
    });
  });
}

function previewText(body) {
  return body.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 60);
}

function renderQuoteBlock(prevMsg) {
  return `
    <div class="quote-block">
      <div class="quote-meta">On ${prevMsg.datetime}, ${prevMsg.from} wrote:</div>
      <span class="quote-link">元のメッセージを表示</span>
    </div>
  `;
}

function renderThreadCard(mail, msg, idx, expanded) {
  const uid = `${mail.id}-${idx}`;
  if (!expanded) {
    return `
      <div class="thread-card collapsed" data-card-toggle="${idx}">
        ${renderDetailAvatar(msg.from)}
        <div class="thread-card-collapsed-info">
          <span class="thread-card-name">${msg.from}</span>
          <span class="thread-card-date">${msg.date}</span>
          <div class="thread-card-preview">${previewText(msg.body)}</div>
        </div>
      </div>
    `;
  }
  const messages = mail._messages;
  const quoteHTML = idx > 0 ? renderQuoteBlock(messages[idx - 1]) : '';
  return `
    <div class="thread-card expanded">
      <div class="detail-meta-row" data-card-toggle="${idx}">
        ${renderDetailAvatar(msg.from)}
        <div class="detail-sender-info">
          <div class="detail-sender-name">${msg.from} <span class="thread-date-inline">${msg.date}</span></div>
          ${renderToLine(uid)}
        </div>
        ${renderSenderCardIcons()}
      </div>
      ${renderToPanel(uid, msg.from, msg.fromEmail, msg.to, msg.toEmail, msg.datetime)}
      <div class="detail-body-text">${msg.body}${(msg.attachments || []).map(renderAttachment).join('')}</div>
      ${quoteHTML}
    </div>
  `;
}

function bindThreadCardToggles(area, mail) {
  area.querySelectorAll('[data-card-toggle]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-to-toggle]') || e.target.closest('.sender-card-icons') || e.target.closest('.detail-title-star')) return;
      const idx = Number(el.getAttribute('data-card-toggle'));
      const scrollPos = area.scrollTop;
      mail._expanded[idx] = !mail._expanded[idx];
      renderDetailBody(mail);
      area.scrollTop = scrollPos;
    });
  });
}

function renderDetailBody(mail) {
  const area = document.getElementById('detail-body-area');
  const messages = mail._messages;

  const subjectRowHTML = `
    <div class="detail-subject-block">
      <span class="detail-subject-text">${mail.subject}</span>
      <span class="inbox-badge">受信トレイ</span>
      <button class="detail-title-star" data-star="${mail.id}">${starSVG(mail.starred)}</button>
    </div>
  `;

  const cardsHTML = messages.map((msg, i) => renderThreadCard(mail, msg, i, mail._expanded[i])).join('');

  const summaryCardHTML = `
    <div class="summary-card" id="summary-card-${mail.id}">
      <div class="summary-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="7" y1="8" x2="17" y2="8"/>
          <line x1="7" y1="12" x2="17" y2="12"/>
          <line x1="7" y1="16" x2="13" y2="16"/>
        </svg>
      </div>
      <span class="summary-label">このメールを要約</span>
      <button class="summary-dismiss" onclick="event.stopPropagation();document.getElementById('summary-card-${mail.id}').classList.add('hidden')" aria-label="閉じる">×</button>
    </div>
  `;

  area.innerHTML = `${subjectRowHTML}${summaryCardHTML}${cardsHTML}`;

  bindToPanelToggles(area);
  bindThreadCardToggles(area, mail);

  const titleStarBtn = area.querySelector('.detail-title-star');
  if (titleStarBtn) {
    titleStarBtn.addEventListener('click', () => {
      mail.starred = !mail.starred;
      titleStarBtn.innerHTML = starSVG(mail.starred);
    });
  }
}

function openDetail(id) {
  const mail = MAILS.find((x) => x.id === id);
  if (!mail) return;
  mail.unread = false;

  if (!mail._messages) {
    mail._messages = mail.thread || [{
      from: mail.name, fromEmail: mail.email, to: '野口', toEmail: MY_EMAIL,
      date: mail.date, datetime: mail.date, body: mail.body,
    }];
  }
  if (!mail._expanded) {
    mail._expanded = mail._messages.map((_, i) => i === mail._messages.length - 1);
  }

  renderDetailBody(mail);
  document.getElementById('detail-body-area').scrollTop = 0;

  document.getElementById('inbox-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'flex';
  renderList();
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('inbox-view').style.display = 'flex';
  renderList();
}

renderList();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      reg.update();
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            window.location.reload();
          }
        });
      });
    }).catch((err) => {
      console.error('Service worker registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
