<!DOCTYPE html>
<!--
  ============================================================
  Mail（Gmail風）新村版
  ============================================================
  ■ ベース: mail-app のルート（中桐版）。デザイン(CSS)・画面構造(HTML)は共通のまま、
    テンプレートの指示どおり (A)MAILS (B)MY_EMAIL (C)account-avatar を差し替えた。
    加えて受信トレイの「まとめ行」（プロモーション / 新着）に対応している。
  ■ 自分: 新村 諒 <niimura@wisdom-hd.com>
  ■ 添付PDFは ./files/ に置き、表示名は元の日本語ファイル名を使う。
  ■ URL: https://nakagiri3019-design.github.io/mail-app/shinmura/（新村）
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mail 新村</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBE8D2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mail 新村">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #FBE8D2; display: flex; justify-content: center; }
#app { width: 100%; max-width: 100%; height: 100vh; height: 100dvh; background: #FBE8D2; display: flex; flex-direction: column; overflow: hidden; position: relative; }

/* INBOX VIEW */
#inbox-view { display: flex; flex-direction: column; height: 100%; position: relative; }
.inbox-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px 10px; background: #FBE8D2; }
.menu-btn, .icon-btn-plain { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
.search-pill { flex: 1; background: #fff; border-radius: 26px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.search-pill span { color: #6B5A45; font-size: 15px; flex: 1; }
.account-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0; }

.tabs-row { display: flex; gap: 10px; padding: 6px 16px 12px; }
.current-tab-label { font-size: 14px; font-weight: 700; color: #1a73e8; }

.mail-list { flex: 1; overflow-y: auto; background: #FBE8D2; padding: 8px 12px 72px; display: flex; flex-direction: column; gap: 8px; }
.mail-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: #FFFCF5; border-radius: 16px; box-shadow: none; cursor: pointer; transition: background 0.1s; }
.mail-row:active { background: #f5f5f5; }
.mail-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; flex-shrink: 0; }
.mail-body { flex: 1; min-width: 0; }
.mail-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mail-sender { font-size: 14.5px; font-weight: 700; color: #3B2A12; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-row.unread .mail-sender { color: #3B2A12; font-weight: 700; }
.mail-date { font-size: 12px; color: #6B5A45; flex-shrink: 0; }
.mail-row.unread .mail-date { color: #3B2A12; font-weight: 700; }
.mail-subject-line { font-size: 13.5px; color: #6B5A45; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.mail-row.unread .mail-subject-line { color: #3B2A12; }
.mail-subject-line .subj { font-weight: 600; }
.mail-row.unread .mail-subject-line .subj { font-weight: 700; }
.mail-snippet { color: #6B5A45; font-weight: 400; }
.star-btn { background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; align-self: center; }

.compose-fab { position: absolute; right: 18px; bottom: 80px; background: #FF7A00; color: #fff; border: none; border-radius: 28px; padding: 16px 24px 16px 18px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(255,122,0,0.4); }

.bottom-tabs { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding: 4px 0 2px; background: #FBE8D2; border-top: 1px solid rgba(0,0,0,0.07); display: flex; align-items: center; justify-content: space-around; box-sizing: border-box; z-index: 20; }
.tab-btn { flex: 1; height: 100%; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tab-icon-circle { width: 64px; height: 32px; border-radius: 16px; background: #EDD5A8; display: flex; align-items: center; justify-content: center; }

/* DETAIL VIEW */
#detail-view { display: none; flex-direction: column; height: 100%; background: #FBE8D2; }
.detail-header { display: flex; align-items: center; gap: 22px; padding: 12px 14px; background: #FBE8D2; position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
.detail-header .spacer { flex: 1; }
.detail-subject-block { padding: 12px 0 4px; text-align: left; }
.detail-subject-text { font-size: 21px; font-weight: 400; color: #3B2A12; line-height: 1.6; }
.inbox-badge { display: inline-block; vertical-align: middle; background: #EDCA7A; color: #5C3210; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 10px; white-space: nowrap; margin-left: 10px; }
.detail-title-star { background: none; border: none; cursor: pointer; padding: 2px; display: inline-flex; vertical-align: middle; margin-left: 10px; }
.detail-meta-row { display: flex; align-items: flex-start; gap: 12px; padding: 4px 16px 8px; }
.detail-to-line { font-size: 12px; color: #6B5A45; margin-top: 2px; }
.sender-card-icons { display: flex; gap: 2px; margin-left: auto; flex-shrink: 0; }
.mini-icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 6px; border-radius: 8px; color: #6B5A45; }
.mini-icon-btn:active { background: rgba(0,0,0,0.06); }
.to-line-toggle { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
.to-arrow { font-size: 9px; }
.sender-detail-panel { display: none; margin: 12px 8px; background: #FAE8CC; border-radius: 10px; padding: 14px 10px 14px 9px; font-size: 15px; line-height: 1.6; color: #6B5A45; }
.sender-detail-panel.open { display: block; }
.sender-detail-panel .panel-row { display: flex; align-items: start; gap: 0; padding: 4px 0; line-height: 1.6; }
.sender-detail-panel .panel-row > span:last-child { flex: 1; font-size: 15px; color: #3B2A12; min-width: 0; overflow-wrap: anywhere; }
/* アドレスは途中で切らずに丸ごと次の行へ回す（画面幅より長い場合のみ途中改行） */
.sender-detail-panel .dt-addr { display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
.sender-detail-panel .panel-label { font-size: 14px; color: #6B5A45; flex: 0 0 49px; }
.security-notice { display: flex; align-items: flex-start; gap: 8px; margin-top: 2px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); font-size: 15px; line-height: 1.6; }
.security-link { color: #C07820; font-size: 15px; font-weight: 600; cursor: pointer; }
.detail-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; flex-shrink: 0; }
.detail-sender-info { flex: 1; min-width: 0; }
.detail-sender-name { font-size: 14px; font-weight: 600; color: #3B2A12; line-height: 1.3; }
.detail-body-area { flex: 1; overflow-y: auto; padding: 60px 16px 160px; }
.detail-body-text { font-size: 16px; line-height: 1.6; color: #3B2A12; white-space: pre-wrap; padding-left: 16px; }
.thread-date-inline { font-weight: 400; color: #6B5A45; font-size: 12px; margin-left: 6px; }
/* カードは画面端から約7px（Gmail 実寸）。body-area の padding 16px を負マージンで詰め、広げた 13px は padding で吸収して中身の位置は据え置く */
.thread-card { background: #FFFCF5; border-radius: 6px; margin: 0 -9px 2px; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); box-shadow: none; }
.thread-card.collapsed { min-height: 92px; padding: 16px 25px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.thread-card .detail-avatar { width: 40px; height: 40px; font-size: 15px; }
.thread-card-collapsed-info { flex: 1; min-width: 0; }
.thread-card-name { font-size: 15px; font-weight: 600; color: #3B2A12; }
.thread-card-date { font-size: 11.5px; color: #6B5A45; margin-left: 6px; }
.thread-card-preview { font-size: 13px; font-weight: 400; color: #7A6A55; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; white-space: normal; margin-top: 4px; line-height: 1.45; }
.thread-card.expanded { padding: 14px 29px 18px; }
.thread-card.expanded .detail-meta-row { padding: 12px 0 4px; cursor: pointer; }
.thread-card.expanded .detail-body-text { margin-top: 12px; }
/* 詳細ボックスは画面端から約21px（カード端7px + border 1px + padding 29px − 16px） */
.thread-card.expanded .sender-detail-panel { margin: 12px -16px; }
/* 引用（Gmail と同じ形）：閉じているときは「•••」だけ。開くと引用元の行＋左線のブロックを、スレッドの古いメールまで入れ子でさかのぼる */
.gq-wrap { padding-left: 16px; margin-top: 12px; min-width: 0; font-size: 16px; line-height: 1.6; color: #3B2A12; overflow-wrap: anywhere; }
.gq-dots { display: block; padding: 6px 0; margin: 0; background: none; border: none; cursor: pointer; }
.gq-attr + .gq-dots { margin-top: 6px; } /* 引用元の行と「•••」の間は約12px（ボタン上の余白6px込み） */
.gq-dots span { display: flex; align-items: center; justify-content: center; gap: 3px; width: 24px; height: 12px; border-radius: 6px; background: #E8EAED; }
.gq-dots i { width: 3px; height: 3px; border-radius: 50%; background: #5F6368; }
.gq-dots.is-open span { background: #BDC1C6; }
.gq-dots.is-open i { background: #F8F9FA; }
.gq-addr { color: #1155CC; text-decoration: underline; }
.gq-wrap .gq-addr { cursor: pointer; border-radius: 3px; } /* メール詳細の引用だけ押せる（作成画面の引用は押せない） */
.gq-wrap .gq-addr:active { background: rgba(17,85,204,0.12); }
.gq { margin: 0; padding-left: 8px; border-left: 1px solid #CCCCCC; min-width: 0; }
.gq.gq-flat { padding-left: 0; border-left: none; }
.gq-body { white-space: pre-wrap; }
.gq-body + .gq-attr { margin-top: 16px; }
.attachment-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; margin-right: 16px; white-space: normal; }
.attachment-card { width: 100%; background: #fff; border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.attachment-preview { background: #fff; height: 220px; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; }
.attachment-preview canvas { max-width: 100%; height: auto; object-fit: contain; display: block; }
.attachment-info-bar { background: #FFE4AE; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.attachment-icon-pdf { flex-shrink: 0; }
.attachment-file-name { flex: 1; min-width: 0; font-size: 13px; color: #3B2A12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attachment-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.attachment-action-icon { flex-shrink: 0; color: #6B5A45; }
.detail-actions { position: fixed; left: 0; right: 0; bottom: 56px; padding: 12px 16px; background: #FBE8D2; border-top: 1px solid rgba(0,0,0,0.07); display: flex; align-items: center; gap: 4px; z-index: 15; }
.detail-action-btn { flex: 1; background: #475A6E; border: none; height: 44px; border-radius: 22px; margin: 0 4px; font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.detail-emoji-btn { width: 48px; height: 48px; flex-shrink: 0; background: #475A6E; border: none; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* まとめ行（プロモーション / 新着）。中桐版の .mail-row をそのまま使い、
   右端の日付の代わりに新着件数を出す。 */
.summary-count { font-size: 12px; font-weight: 700; color: #1B7A3E; white-space: nowrap; flex-shrink: 0; align-self: center; padding-left: 6px; }
.mail-row.summary-row { cursor: default; }

/* ===== 作成画面（返信・全員に返信・転送・新規作成）=====
   寸法は幅360pxの Gmail 実機スクショ基準。右側のアイコンは右端からの距離で置くので幅が変わっても右寄せのまま。 */
#cmp { position: fixed; top: 0; left: 0; right: 0; height: 100%; z-index: 100; background: #FFFFFF; color: #3B2A12; display: none; flex-direction: column; }
#cmp.open { display: flex; }
.cmp-bar { position: relative; flex: 0 0 auto; height: 54px; }
.cmp-bar-btn { position: absolute; top: 7px; width: 40px; height: 40px; padding: 0; background: none; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.cmp-bar-btn:active, .cmp-mode:active, .cmp-drop:active, .cmp-caret:active, .cmp-att-x:active { background: rgba(0,0,0,0.06); }
.cmp-back { left: 4px; }    /* 中心 24px */
.cmp-clip { right: 86px; }  /* 中心 右端から106px（360pxで254px） */
.cmp-send { right: 44px; }  /* 中心 右端から64px（296px） */
.cmp-more { right: 3px; }   /* 中心 右端から23px（337px） */
.cmp-scroll { flex: 1 1 auto; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.cmp-row { position: relative; border-bottom: 1px solid rgba(0,0,0,0.08); }
.cmp-row[hidden] { display: none; }
.cmp-label { position: absolute; left: 14px; font-size: 16px; line-height: 22px; color: #9A8574; }
.cmp-caret { position: absolute; right: 5px; width: 40px; height: 40px; padding: 0; background: none; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; } /* 中心 右端から25px（335px） */
.cmp-from { height: 48px; }
.cmp-from .cmp-label { top: 13px; }
.cmp-from .cmp-caret { top: 4px; }
.cmp-from-value { position: absolute; left: 63px; right: 50px; top: 13px; font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 宛先・Cc・Bcc 行（高さは区切り線込み）。チップ(31px)がある時は上下9pxで50px、空の時は上下7pxで46px */
.cmp-recip { --cmp-pad: 7px; }
.cmp-recip.has-chips { --cmp-pad: 9px; }
.cmp-recip .cmp-label { top: calc(var(--cmp-pad) + 4.5px); }
.cmp-recip .cmp-caret, .cmp-mode, .cmp-drop { top: calc(var(--cmp-pad) - 4.5px); }
.cmp-mode { position: absolute; left: 4px; width: 40px; height: 40px; padding: 0; background: none; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; } /* 中心 24px */
.cmp-drop { position: absolute; left: 36px; width: 20px; height: 40px; padding: 0; background: none; border: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; } /* 中心 46px */
.cmp-chips { margin: 0 50px 0 63px; padding: var(--cmp-pad) 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.cmp-chip { display: inline-flex; align-items: center; gap: 8px; height: 31px; max-width: 100%; padding: 0 12px 0 0.5px; border: 1px solid #C9BFB3; border-radius: 16px; }
.cmp-chip-av { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 600; }
.cmp-chip-name { min-width: 0; font-size: 16px; line-height: 29px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 入力欄は長い名前のチップの後ろでも改行させない（入力中だけ幅を確保） */
.cmp-input { flex: 1 1 0; min-width: 0; height: 31px; padding: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #3B2A12; }
.cmp-subject textarea, .cmp-body textarea { display: block; width: 100%; border: none; outline: none; background: transparent; resize: none; overflow: hidden; font-family: inherit; font-size: 16px; line-height: 22px; color: #3B2A12; }
.cmp-subject textarea { padding: 15.5px 14px; } /* 1行で区切り線込み54px */
.cmp-input:focus { min-width: 60px; }
#cmp textarea, #cmp input { caret-color: #875400; }
.cmp-recip.has-chips .cmp-input:not(:focus) { margin-left: -6px; } /* チップが列幅いっぱいでも gap 分で改行しない */
#cmp textarea::placeholder, #cmp input::placeholder { color: #ACA39A; opacity: 1; }
.cmp-body { padding: 16px 14px 32px; }
.cmp-body textarea { min-height: 22px; padding: 0; }
.cmp-body textarea.has-dots { margin-bottom: 22px; } /* 「•••」は本文欄の上端から約60px下 */
.cmp-quote-wrap { min-width: 0; font-size: 16px; line-height: 1.6; color: #3B2A12; overflow-wrap: anywhere; } /* 中身は本文の引用と同じ .gq-* */
.cmp-atts { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.cmp-att { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px 0 12px; border: 1px solid #D8CFC4; border-radius: 8px; background: #FFFFFF; }
.cmp-att-name { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp-att-x { flex: 0 0 36px; width: 36px; height: 36px; padding: 0; background: none; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.cmp-menu { position: fixed; z-index: 110; display: none; min-width: 176px; padding: 6px 0; background: #FFFFFF; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
.cmp-menu.open { display: block; }
.cmp-menu button { display: flex; align-items: center; gap: 16px; width: 100%; height: 48px; padding: 0 20px 0 16px; background: none; border: none; font-family: inherit; font-size: 16px; color: #3B2A12; text-align: left; cursor: pointer; }
.cmp-menu button:active { background: rgba(0,0,0,0.06); }
.cmp-snackbar { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 120; padding: 14px 16px; background: #323232; color: #fff; font-size: 14px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.25); opacity: 0; transform: translateY(12px); transition: opacity .2s, transform .2s; pointer-events: none; }
.cmp-snackbar.show { opacity: 1; transform: none; }
/* 詳細ボックスのアドレス：押したときだけ薄く反応（レイアウトは変えない） */
.sender-detail-panel .dt-addr { cursor: pointer; border-radius: 3px; transition: background-color .12s; }
.sender-detail-panel .dt-addr:active { background: rgba(0,0,0,0.08); }

/* ===== ドロワー（受信トレイの ≡ から開く）=====
   寸法・色は幅360pxの Gmail 実機スクショ基準。幅は端末幅によらず 280px 固定。 */
.drw-scrim { position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,0.6); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s; touch-action: none; }
.drw-scrim.open { opacity: 1; visibility: visible; transition: opacity .25s ease; }
.drw { position: fixed; top: 0; bottom: 0; left: 0; z-index: 200; width: 280px; max-width: 100%; background: #F5EADE; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; touch-action: pan-y; }
.drw.open { transform: translateX(0); visibility: visible; transition: transform .25s ease; }
.drw.dragging { transition: none; }
.drw-head { position: relative; height: 95px; border-bottom: 1px solid #A9ACAA; }
.drw-logo { position: absolute; left: 21px; top: 50px; font-size: 22px; line-height: 28px; font-weight: 400; color: #D93025; letter-spacing: 0.2px; } /* 文字の中心が上から64px */
.drw-sep { height: 0; border-top: 1px solid #A9ACAA; }
.drw-all { height: 57px; display: flex; align-items: center; border-bottom: 1px solid #A9ACAA; }
.drw-row { height: 43px; display: flex; align-items: center; }
.drw-item { position: relative; display: flex; align-items: center; width: calc(100% - 14px); height: 42px; margin: 0 7px; padding: 0 14px 0 12px; border: none; border-radius: 21px; background: none; font-family: inherit; text-align: left; cursor: pointer; color: #202124; }
.drw-item:active { background: rgba(0,0,0,0.06); }
.drw-item.selected { background: #DAE2FF; color: #465170; }
.drw-item.selected:active { background: #D0D9F5; }
.drw-icon { flex: 0 0 24px; width: 24px; height: 24px; color: #3C4043; } /* 中心が左端から31px */
.drw-item.selected .drw-icon { color: #465170; }
.drw-icon.accent { color: #785A24; }
.drw-label { flex: 1; min-width: 0; margin-left: 20px; font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* 文字は左端63px */

<!-- 起動スプラッシュ。Android WebAPK が manifest の background_color を
     反映しないため HTML 側で白の起動画面を出す。load 後にフェードアウトして DOM から除去する。 -->
<div id="splash" style="position:fixed;inset:0;z-index:2147483647;background:#FFFFFF;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;">
  <img src="./icons/icon-512.png" alt="" style="width:160px;height:160px;">
</div>
<script>
(function () {
  var splash = document.getElementById('splash');
  var done = false;
  function hide() {
    if (done) return;
    done = true;
    splash.style.pointerEvents = 'none';
    splash.style.opacity = '0';
    setTimeout(function () { splash.remove(); }, 550);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
  // 画像の読み込みが止まっても起動画面に閉じ込めない保険
  setTimeout(hide, 4000);
})();
</script>

function formatDatetime(dt) {
  if (!dt || dt.includes('午前') || dt.includes('午後')) return dt;
  const m = dt.match(/(\d{4}年\d+月\d+日)[^0-9]*(\d+):(\d+)/);
  if (!m) return dt;
  const h = parseInt(m[2], 10);
  const min = m[3];
  const ampm = h < 12 ? '午前' : '午後';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${m[1]} ${ampm}${h12}:${min}`;
}

function renderPdfThumbnails(area) {
  if (typeof pdfjsLib === 'undefined') return;
  area.querySelectorAll('canvas.pdf-thumb-canvas[data-pdf-url]').forEach((canvas) => {
    if (canvas.dataset.rendered) return;
    canvas.dataset.rendered = '1';
    const url = canvas.getAttribute('data-pdf-url');
    pdfjsLib.getDocument({
      url: url,
      cMapUrl: './attachments/cmaps/',
      cMapPacked: true,
    }).promise
      .then((pdf) => pdf.getPage(1))
      .then((page) => {
        const containerWidth = canvas.parentElement.clientWidth;
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = containerWidth / baseViewport.width;
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        return page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      })
      .catch((err) => {
        console.error('PDF preview render failed:', err);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#999';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('プレビュー不可', canvas.width / 2, canvas.height / 2);
      });
  });
}

  var m = datetimeStr.match(/(\d+)年(\d+)月(\d+)日[^0-9]*(\d+):(\d+)/);
  if (!m) return datetimeStr;
  var y = parseInt(m[1],10), mo = parseInt(m[2],10), d = parseInt(m[3],10);
  var hour = parseInt(m[4], 10), mm = m[5];
  if (ampm && ampm[1] === '午後' && hour < 12) hour += 12;
  if (ampm && ampm[1] === '午前' && hour === 12) hour = 0;
  var now = new Date();
  var ty = now.getFullYear(), tmo = now.getMonth()+1, td = now.getDate();
  if (y === ty && mo === tmo && d === td) {
    return hour + ':' + mm;
  } else if (y === ty) {
    return mo + '月' + d + '日';
  } else {
    return y + '/' + mo + '/' + d;
  }
}

function getLatestTimestamp(m) {
  var lastMsg = (m.thread && m.thread.length > 0) ? m.thread[m.thread.length - 1] : m;
  var str = lastMsg.datetime || lastMsg.date || m.date || '';
  var ampm = str.match(/(午前|午後)/);
  var r = str.match(/(\d+)年(\d+)月(\d+)日(?:\([^)]+\))?\s*(?:午前|午後)?\s*(\d+):(\d+)/);
  if (!r) return -1;
  var hour = parseInt(r[4], 10);
  if (ampm && ampm[1] === '午後' && hour < 12) hour += 12;
  if (ampm && ampm[1] === '午前' && hour === 12) hour = 0;
  return parseInt(r[1])*100000000 + parseInt(r[2])*1000000 + parseInt(r[3])*10000
       + hour*100 + parseInt(r[5]);
}

function summaryIcon(kind) {
  if (kind === 'bell') {
    return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`;
  }
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="#fff" stroke="none"/></svg>`;
}

// まとめ行。開くスレッドは持たないので、タップしてもデモの通知だけ出す。
function renderSummaryRow(m) {

function renderList() {
  const list = document.getElementById('mail-list');
  var sorted = MAILS.slice().sort(function(a, b) {
    var pa = (a.pinOrder === undefined) ? Infinity : a.pinOrder;
    var pb = (b.pinOrder === undefined) ? Infinity : b.pinOrder;
    if (pa !== pb) return pa - pb;
    return getLatestTimestamp(b) - getLatestTimestamp(a);
  });
  list.innerHTML = sorted.map((m) => {
    if (m.summary) return renderSummaryRow(m);
    var lastMsg = (m.thread && m.thread.length > 0) ? m.thread[m.thread.length - 1] : m;

  }).join('');

      const mail = MAILS.find((x) => x.id === id);
      if (!mail) return;
      mail.starred = !mail.starred;
      btn.innerHTML = starSVG(mail.starred);

}

function previewText(body) {
  return body.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 60);
}

// 引用元の行の日時は「2026年9月25日(金) 11:34」（曜日つき・24時間表記）
function quoteDate(dt) {
  const m = String(dt || '').match(/(\d{4})年(\d+)月(\d+)日(?:\([^)]*\))?\s*(午前|午後)?\s*(\d+):(\d+)/);
  if (!m) return String(dt || '');
  let h = parseInt(m[5], 10);
  if (m[4] === '午後' && h < 12) h += 12;
  if (m[4] === '午前' && h === 12) h = 0;
  const wd = '日月火水木金土'[new Date(+m[1], +m[2] - 1, +m[3]).getDay()];
  return `${m[1]}年${+m[2]}月${+m[3]}日(${wd}) ${h}:${m[6]}`;
}

function quoteAttr(msg) {
  const addr = msg.fromEmail ? ` &lt;<span class="gq-addr" data-addr="${msg.fromEmail}" data-name="${String(msg.from || '').replace(/"/g, '&quot;')}">${msg.fromEmail}</span>&gt;` : '';
  return `<div class="gq-attr">${quoteDate(msg.datetime || msg.date)} ${msg.from}${addr}:</div>`;
}

// messages[idx] の本文を縦線のブロックにし、その1つ前のメールも同じ形で中に入れる（スレッドの最初のメールまで）
// 入れ子が深くなっても狭い画面で横にはみ出さないよう、線と余白は QUOTE_MAX_INDENT 段までにする
const QUOTE_MAX_INDENT = 10;
function renderQuoteNest(messages, idx, depth) {
  const inner = idx > 0 ? quoteAttr(messages[idx - 1]) + renderQuoteNest(messages, idx - 1, depth + 1) : '';
  return `<blockquote class="gq${depth >= QUOTE_MAX_INDENT ? ' gq-flat' : ''}"><div class="gq-body">${messages[idx].body || ''}</div>${inner}</blockquote>`;
}

// 引用部分の中身（メール詳細と作成画面で共通）。開くと 引用元の行 → 「•••」 → 引用ブロック
// 閉じているときは、メール詳細では 引用元の行 → 「•••」、作成画面（attrWhenClosed なし）では「•••」だけ
function renderQuoteInner(messages, idx, open, btnAttr, attrWhenClosed) {
  const dots = `<button class="gq-dots${open ? ' is-open' : ''}" ${btnAttr} aria-label="${open ? '引用部分を隠す' : '引用部分を表示'}"><span><i></i><i></i><i></i></span></button>`;
  if (open) return quoteAttr(messages[idx]) + dots + renderQuoteNest(messages, idx, 0);
  return (attrWhenClosed ? quoteAttr(messages[idx]) : '') + dots;
}

function renderThreadCard(mail, msg, idx, expanded) {
  const uid = `${mail.id}-${idx}`;
  if (!expanded) {
    return `
      <div class="thread-card collapsed" data-card-toggle="${idx}">
        ${renderDetailAvatar(msg.from)}
        <div class="thread-card-collapsed-info">
          <span class="thread-card-name">${msg.from}</span>
          <span class="thread-card-date">${msg.date}</span>
          <div class="thread-card-preview">${previewText(msg.body)}</div>
        </div>
      </div>
    `;
  }
  const messages = mail._messages;
  const quoteOpen = !!(mail._quoteOpen && mail._quoteOpen[idx]);
  const quoteHTML = idx > 0 ? `<div class="gq-wrap">${renderQuoteInner(messages, idx - 1, quoteOpen, `data-quote-toggle="${idx}"`, true)}</div>` : '';
  return `
    <div class="thread-card expanded">
      <div class="detail-meta-row" data-card-toggle="${idx}">
        ${renderDetailAvatar(msg.from)}
        <div class="detail-sender-info">
          <div class="detail-sender-name">${msg.from} <span class="thread-date-inline">${msg.date}</span></div>
          ${renderToLine(uid)}
        </div>
        ${renderSenderCardIcons(idx)}
      </div>
      ${renderToPanel(uid, msg.from, msg.fromEmail, msg.to, msg.toEmail, msg.datetime)}
      <div class="detail-body-text">${msg.body}${(msg.attachments && msg.attachments.length) ? `<div class="attachment-grid">${msg.attachments.map(renderAttachment).join('')}</div>` : ''}</div>
      ${quoteHTML}
    </div>
  `;
}

function bindThreadCardToggles(area, mail) {
  area.querySelectorAll('[data-card-toggle]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-to-toggle]') || e.target.closest('.sender-card-icons') || e.target.closest('.detail-title-star')) return;
      const idx = Number(el.getAttribute('data-card-toggle'));
      const scrollPos = area.scrollTop;
      mail._expanded[idx] = !mail._expanded[idx];
      renderDetailBody(mail);
      area.scrollTop = scrollPos;
    });
  });
  area.querySelectorAll('[data-quote-toggle]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = Number(el.getAttribute('data-quote-toggle'));
      const scrollPos = area.scrollTop;
      mail._quoteOpen = mail._quoteOpen || {};
      mail._quoteOpen[idx] = !mail._quoteOpen[idx];
      renderDetailBody(mail);
      area.scrollTop = scrollPos;
    });
  });
}

function renderDetailBody(mail) {
  const area = document.getElementById('detail-body-area');
  const messages = mail._messages;

  const subjectRowHTML = `
    <div class="detail-subject-block">
      <span class="detail-subject-text">${mail.subject}</span>
      <span class="inbox-badge">受信トレイ</span>
      <button class="detail-title-star" data-star="${mail.id}">${starSVG(mail.starred)}</button>
    </div>
  `;

  const cardsHTML = messages.map((msg, i) => renderThreadCard(mail, msg, i, mail._expanded[i])).join('');

  area.innerHTML = `${subjectRowHTML}${cardsHTML}`;

  bindToPanelToggles(area);
  bindThreadCardToggles(area, mail);
  renderPdfThumbnails(area);

  const titleStarBtn = area.querySelector('.detail-title-star');
  if (titleStarBtn) {
    titleStarBtn.addEventListener('click', () => {
      mail.starred = !mail.starred;
      titleStarBtn.innerHTML = starSVG(mail.starred);
    });
  }
}

function openDetail(id) {
  const mail = MAILS.find((x) => x.id === id);
  if (!mail) return;
  window.currentDetailMail = mail;  // 作成画面（返信・転送）の対象
  mail.unread = false;

  if (!mail._messages) {
    mail._messages = mail.thread || [{
      from: mail.name, fromEmail: mail.email, to: MY_NAME, toEmail: MY_EMAIL,
      date: mail.date, datetime: mail.datetime || mail.date, body: mail.body,
    }];
  }
  if (!mail._expanded) {
    mail._expanded = mail._messages.map((_, i) => i === mail._messages.length - 1);
  }

  renderDetailBody(mail);
  document.getElementById('detail-body-area').scrollTop = 0;

  document.getElementById('inbox-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'flex';
  renderList();
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('inbox-view').style.display = 'flex';
  renderList();
}

renderList();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
      reg.update();
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            window.location.reload();
          }
        });
      });
    }).catch((err) => {
      console.error('Service worker registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

  let menuOwner = null;

  };

  // 宛先は「名前 + アドレス」1件が基本。カンマ区切りの複数や {name,email} 配列、cc / replyTo 項目にも対応しておく

    return es.map((email, i) => ({ name: ns[i] || '', email }));
  }

  function gmailDate(dt) {

    const wd = '日月火水木金土'[new Date(+m[1], +m[2] - 1, +m[3]).getDay()];
    return `${m[1]}年${+m[2]}月${+m[3]}日(${wd}) ${h}:${m[6]}`;
  }

  // 返信・転送の中身を作り直す（本文に入力した文字は残す）
  function build(mode) {

    } else {
      st.to = replyTargets(m);

  }

  function chip(r) {
    const label = r.name || String(r.email).split('@')[0];
    return `<span class="cmp-chip" title="${esc(r.email)}"><span class="cmp-chip-av" style="background:${colorFor(label)}">${esc(label.trim().charAt(0))}</span><span class="cmp-chip-name">${esc(label)}</span></span>`;
  }
  function recipRow(kind, list) {

    else if (st.mode === 'new') lead = '<span class="cmp-label">宛先</span>';
    else lead = `<button class="cmp-mode" data-cmp="mode" aria-label="${MODE_LABEL[st.mode]}">${ICON[st.mode]}</button><button class="cmp-drop" data-cmp="mode" aria-label="返信の種類を切り替え">${ICON.drop}</button>`;

      // 返信は本文の引用と同じ作り：返信先のメールの本文＋それより前のメールを入れ子で
      const msgs = st.mail && st.mail._messages && st.mail._messages.indexOf(m) >= 0 ? st.mail._messages : [m];
      quote = `<div class="cmp-quote-wrap">${renderQuoteInner(msgs, msgs.indexOf(m), st.quoteOpen, 'data-cmp="dots"')}</div>`;
    }
    const atts = st.attachments.length
      ? `<div class="cmp-atts">${st.attachments.map((n, i) => `<div class="cmp-att">${ICON.pdf}<span class="cmp-att-name">${esc(n)}</span><button class="cmp-att-x" data-cmp="att-x" data-i="${i}" aria-label="添付を外す">${ICON.x}</button></div>`).join('')}</div>`
      : '';
    extraEl.innerHTML = quote + atts;
  }

  function grow(t) {
    t.style.height = 'auto';
    t.style.height = t.scrollHeight + 'px';
  }

  // キーボードが出たら表示領域(visualViewport)に合わせて縮め、入力中の行が隠れないようにする
  function keepVisible(el) {
    const r = el.getBoundingClientRect();
    const s = scrollEl.getBoundingClientRect();
    // 本文は入力位置が末尾のときだけ下端まで送る（途中を編集中は動かさない）
    if (r.bottom > s.bottom - 8 && (el !== bodyEl || el.selectionEnd >= el.value.length)) {
      scrollEl.scrollTop += r.bottom - s.bottom + 8;
    } else if (r.top < s.top) {
      scrollEl.scrollTop -= s.top - r.top + 8;
    }
  }
  function fitViewport() {
    const vv = window.visualViewport;
    if (!vv || !root.classList.contains('open')) return;
    root.style.top = vv.offsetTop + 'px';
    root.style.height = vv.height + 'px';
    const a = document.activeElement;
    if (a && root.contains(a) && /^(TEXTAREA|INPUT)$/.test(a.tagName)) keepVisible(a);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', fitViewport);
  }
  window.addEventListener('resize', fitViewport);
  root.addEventListener('focusin', () => setTimeout(fitViewport, 300));

  function open(state) {
    st = state;
    closeMenu();
    bodyEl.value = '';
    render();
    scrollEl.scrollTop = 0;
    if (!root.classList.contains('open')) {
      root.classList.add('open');
      root.setAttribute('aria-hidden', 'false');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { prevThemeColor = meta.getAttribute('content'); meta.setAttribute('content', '#FFFFFF'); }
      history.pushState({ cmp: true }, '');   // Android の戻る操作で閉じる
    }
    grow(subjectEl);
    grow(bodyEl);
    fitViewport();
  }
  function hide() {
    root.classList.remove('open');
    root.setAttribute('aria-hidden', 'true');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && prevThemeColor !== null) meta.setAttribute('content', prevThemeColor);
    prevThemeColor = null;
    root.style.top = '';
    root.style.height = '';
    closeMenu();
    if (document.activeElement && root.contains(document.activeElement)) document.activeElement.blur();
    st = null;
  }
  window.addEventListener('popstate', () => { if (root.classList.contains('open')) hide(); });

  function showSnackbar(text) {
    snackbar.textContent = text;
    snackbar.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => snackbar.classList.remove('show'), 3000);
  }

  function showMenu(anchor, modes, onPick, alignLeft) {
    menu.innerHTML = modes.map((k) => `<button role="menuitem" data-mode="${k}">${ICON[k]}<span>${MODE_LABEL[k]}</span></button>`).join('');
    menu.classList.add('open');
    const r = anchor.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = alignLeft ? r.left : r.right - mw;
    left = Math.max(8, Math.min(left, vw - mw - 8));
    let top = r.bottom + 4;
    if (top + mh > vh - 8) top = Math.max(8, r.top - mh - 4);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menuOwner = anchor;
    menu.onclick = (e) => {
      const b = e.target.closest('[data-mode]');
      if (!b) return;
      closeMenu();
      onPick(b.getAttribute('data-mode'));
    };
  }
  function closeMenu() {
    menu.classList.remove('open');
    menuOwner = null;
  }
  document.addEventListener('click', (e) => {
    if (!menu.classList.contains('open')) return;
    if (menu.contains(e.target) || (menuOwner && menuOwner.contains(e.target))) return;
    closeMenu();
  }, true);
  const modesFor = (m) => (canReplyAll(m) ? ['reply', 'replyAll', 'forward'] : ['reply', 'forward']);

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-cmp]');
    if (!t) {
      const chips = e.target.closest('.cmp-chips');
      if (chips) chips.querySelector('.cmp-input').focus();
      return;
    }
    const k = t.getAttribute('data-cmp');
    if (k === 'mode') {
      if (menu.classList.contains('open')) { closeMenu(); return; }
      showMenu(root.querySelector('.cmp-mode'), modesFor(st.msg), (mode) => { build(mode); render(); }, true);
    } else if (k === 'ccbcc') {
      st.ccOpen = !st.ccOpen;
      document.getElementById('cmp-cc-row').hidden = !st.ccOpen;
      document.getElementById('cmp-bcc-row').hidden = !st.ccOpen;
    } else if (k === 'dots') {
      st.quoteOpen = !st.quoteOpen;
      renderExtra();
    } else if (k === 'att-x') {
      st.attachments.splice(Number(t.getAttribute('data-i')), 1);
      renderExtra();
    }
  });
  subjectEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
  [subjectEl, bodyEl].forEach((t) => t.addEventListener('input', () => { grow(t); keepVisible(t); }));

  // ---- 開き方 ----
  function openFor(mode, idx) {
    const mail = window.currentDetailMail;
    if (!mail || !mail._messages || !mail._messages.length) return;
    const msgs = mail._messages;
    const msg = msgs[idx == null ? msgs.length - 1 : idx];
    st = { mail, msg };
    build(mode === 'replyAll' && !canReplyAll(msg) ? 'reply' : mode);
    open(st);
  }
  window.cmpReply = (idx) => openFor('reply', idx);            // 各メールの ↩
  window.cmpLatest = (mode) => openFor(mode);                  // 画面下部の「返信」「転送」＝最新のメール
  window.cmpMsgMenu = function (ev, idx) {                     // 各メールの ⋮
    ev.stopPropagation();
    const mail = window.currentDetailMail;
    if (!mail || !mail._messages) return;
    const btn = ev.currentTarget;
    if (menu.classList.contains('open') && menuOwner === btn) { closeMenu(); return; }
    showMenu(btn, modesFor(mail._messages[idx]), (mode) => openFor(mode, idx), false);
  };
  window.cmpNew = () => open({ mode: 'new', mail: null, msg: null, to: [], cc: [], subject: '', attachments: [], ccOpen: false, quoteOpen: false });  // 受信トレイの「作成」
  window.cmpNewTo = (name, email) => open({ mode: 'new', mail: null, msg: null, to: [{ name: name || '', email }], cc: [], subject: '', attachments: [], ccOpen: false, quoteOpen: false });
  window.cmpClose = function () {
    if (history.state && history.state.cmp) history.back();
    else hide();
  };
  window.cmpSend = function () {
    window.cmpClose();
    showSnackbar('送信しました');
  };

  // 詳細ボックスと本文下の引用元の行のメールアドレスをタップ → 新規作成（「•••」の開閉は起きない）
  document.getElementById('detail-body-area').addEventListener('click', (e) => {
    const a = e.target.closest('.dt-addr, .gq-addr');
    if (!a) return;
    e.stopPropagation();
    window.cmpNewTo(a.getAttribute('data-name') || '', a.getAttribute('data-addr') || a.textContent.trim());
  });
  // iOS Safari でも :active（押した時の反応）を効かせる
  document.addEventListener('touchstart', () => {}, { passive: true });
})();
</script>
<script>
// ===== ドロワー（受信トレイの ≡ から開く）=====
// 「メイン」以外の項目はデモなので閉じるだけ。件数は「すべてのメール」だけ出す。
(function () {
  const drw = document.getElementById('drw');
  const scrim = document.getElementById('drw-scrim');
  let prevThemeColor = null;

  // Material Symbols（outline）相当の形を線で描く。色は currentColor
  const P = {
    allInbox: '<path d="M3.5 4h17v7h-5.5a3 3 0 0 1-6 0H3.5z"/><path d="M3.5 14h5.2a3.3 3.3 0 0 0 6.6 0h5.2v6h-17z"/>',
    inbox: '<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 14h5.2a3.3 3.3 0 0 0 6.6 0h5.2"/>',
    tag: '<path d="M3.5 12.2V4h8.2l8.8 8.8-8.2 8.2z"/><circle cx="7.8" cy="8.3" r="1.3"/>',
    group: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5 6-5s6 1.8 6 5z"/><path d="M15.5 5.4a3.1 3.1 0 0 1 0 6.2M17.6 14.7c2.1.5 3.4 2.2 3.4 4.8"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.4"/>',
    star: '<path d="M12 3.8l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6L12 16.4l-5.1 2.8L8 13.6 3.8 9.7l5.7-.7z"/>',
    snooze: '<circle cx="12" cy="12.5" r="8"/><path d="M12 8.5v4.3l3 1.8M4.5 4.5l2.5-2M19.5 4.5l-2.5-2"/>',
    important: '<path d="M4 6h11.3l4.7 6-4.7 6H4l4.2-6z"/>',
    bag: '<path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/>',
    send: '<path d="M3.5 19.5L21 12 3.5 4.5l2 7.5z"/><path d="M5.5 12H12"/>',
    scheduleSend: '<path d="M11 16.7l-7.5 3.3 2-8-2-8L18.5 10"/><path d="M5.5 12h5"/><circle cx="17" cy="16" r="4.5"/><path d="M17 13.8v2.3l1.5 1"/>',
    outbox: '<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 14h5.2a3.3 3.3 0 0 0 6.6 0h5.2M12 11V6.5M9.5 9L12 6.5 14.5 9"/>',
    draft: '<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/>',
    allMail: '<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>',
    spam: '<path d="M8.4 3.5h7.2l5 5v7.1l-5 5H8.4l-5-5V8.5z"/><path d="M12 7.5v5.5M12 16v.5"/>',
    trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
    subscriptions: '<path d="M20.5 11V6.5a1.5 1.5 0 0 0-1.5-1.5H5a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 5 19h8"/><path d="M3.5 6.5l8.5 6 8.5-6"/><circle cx="18" cy="17" r="3.5"/><path d="M16.4 17h3.2"/>',
    add: '<path d="M12 5v14M5 12h14"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    contacts: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="10" r="3"/><path d="M6.6 18.2c1.3-1.9 3.1-2.8 5.4-2.8s4.1.9 5.4 2.8"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M10.4 3.5h3.2l.5 2.4 1.7 1 2.3-.8 1.6 2.8-1.8 1.6v2l1.8 1.6-1.6 2.8-2.3-.8-1.7 1-.5 2.4h-3.2l-.5-2.4-1.7-1-2.3.8-1.6-2.8L6.1 13v-2L4.3 9.4l1.6-2.8 2.3.8 1.7-1z"/>',
    help: '<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.4 2.4 0 1 1 3.5 2.1c-.7.4-1.1.9-1.1 1.7v.4M12 16.6v.4"/>',
  };
  const icon = (k, accent) => `<svg class="drw-icon${accent ? ' accent' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
  const item = (k, label, opts = {}) => `<div class="drw-row"><button class="drw-item${opts.selected ? ' selected' : ''}" data-drw="${opts.action || 'close'}">${icon(k, opts.accent)}<span class="drw-label">${label}</span>${opts.count != null ? `<span class="drw-count">${opts.count}</span>` : ''}${opts.badge ? `<span class="drw-badge">${opts.badge}</span>` : ''}</button></div>`;
  const mailCount = MAILS.filter((m) => !m.summary).length;  // まとめ行（プロモーション等）はメールではないので数えない

  drw.innerHTML = [
    '<div class="drw-head"><span class="drw-logo">Gmail</span></div>',
    `<div class="drw-all"><button class="drw-item" data-drw="close">${icon('allInbox')}<span class="drw-label">すべての受信トレイ</span></button></div>`,
    '<div style="height:8px"></div>',
    item('inbox', 'メイン', { selected: true, action: 'main' }),
    item('tag', 'プロモーション'),
    item('group', 'ソーシャル'),
    item('info', '新着'),
    '<div class="drw-heading">すべてのラベル</div>',
    item('star', 'スター付き'),
    item('snooze', 'スヌーズ中'),
    item('important', '重要'),
    item('bag', '購入'),
    item('send', '送信済み'),
    item('scheduleSend', '送信予定'),
    item('outbox', '送信トレイ'),
    item('draft', '下書き'),
    item('allMail', 'すべてのメール', { count: mailCount }),
    item('spam', '迷惑メール'),
    item('trash', 'ゴミ箱'),
    item('subscriptions', '配信登録を管理', { badge: '新機能' }),
    item('add', 'ラベルを作成'),
    '<div class="drw-heading">Google アプリ</div>',
    item('calendar', 'カレンダー'),
    item('contacts', 'コンタクト'),
    '<div class="drw-sep drw-sep-bottom"></div>',
    item('settings', '設定', { accent: true }),
    item('help', 'ヘルプとフィードバック', { accent: true }),
    '<div class="drw-foot"></div>',
  ].join('');

  // ステータスバーは暗幕がかかった色（元の色に60%の黒を重ねた色）にする
  function dimmed(hex) {
    const m = String(hex || '').trim().match(/^#?([0-9a-f]{6})$/i);
    if (!m) return '#000000';
    const n = parseInt(m[1], 16);
    return '#' + [16, 8, 0].map((s) => Math.round(((n >> s) & 255) * 0.4).toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  const isOpen = () => drw.classList.contains('open');
  function show() {
    if (isOpen()) return;
    drw.scrollTop = 0;
    drw.classList.add('open');
    scrim.classList.add('open');
    drw.setAttribute('aria-hidden', 'false');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { prevThemeColor = meta.getAttribute('content'); meta.setAttribute('content', dimmed(prevThemeColor)); }
    history.pushState({ drw: true }, '');   // Android の戻る操作で閉じる
  }
  function hide() {
    drw.classList.remove('open', 'dragging');
    drw.style.transform = '';
    scrim.classList.remove('open');
    scrim.style.opacity = '';
    drw.setAttribute('aria-hidden', 'true');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && prevThemeColor !== null) meta.setAttribute('content', prevThemeColor);
    prevThemeColor = null;
  }
  function requestClose() {
    if (history.state && history.state.drw) history.back();
    else hide();
  }
  window.addEventListener('popstate', () => { if (isOpen()) hide(); });
  window.drwOpen = show;

  scrim.addEventListener('click', requestClose);
  scrim.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });  // 後ろの一覧を動かさない
  drw.addEventListener('click', (e) => {
    const b = e.target.closest('[data-drw]');
    if (!b) return;
    if (b.getAttribute('data-drw') === 'main' && document.getElementById('detail-view').style.display === 'flex') closeDetail();
    requestClose();
  });

  // 左へのスワイプで閉じる（指に合わせて動かし、1/4以上 or 速く払ったら閉じる）
  let sx = 0, sy = 0, dx = 0, st = 0, dragging = false, decided = false;
  drw.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; dx = 0; st = Date.now(); dragging = false; decided = false;
  }, { passive: true });
  drw.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    const mx = t.clientX - sx, my = t.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      dragging = Math.abs(mx) > Math.abs(my) && mx < 0;
      if (dragging) drw.classList.add('dragging');
    }
    if (!dragging) return;
    e.preventDefault();
    dx = Math.min(0, mx);
    drw.style.transform = `translateX(${dx}px)`;
    scrim.style.opacity = String(1 + dx / drw.offsetWidth);
  }, { passive: false });
  drw.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    drw.classList.remove('dragging');
    const fast = dx < -30 && Date.now() - st < 250;
    drw.style.transform = '';
    scrim.style.opacity = '';
    if (dx < -drw.offsetWidth / 4 || fast) requestClose();
  });
})();
</script>
