    メールの中身は JavaScript の MAILS 配列にデータとして入っています。
  ■ 新しい人を追加するときの手順:
    1. このファイル(index.html)をコピーして、人の名前のフォルダに置く
       例: mail-app/tanaka/index.html
    2. コピー先で、以下の3か所だけ書き換える:
       (A) const MAILS = [ ... ];  メール一覧と本文。この配列の中身をその人向けに差し替える
       (B) const MY_EMAIL = ...    その人のメールアドレス
       (C) account-avatar の中の「中桐」 右上アバターの名前
    3. デザイン(CSS)は触らない＝色やレイアウトは全員共通で引き継がれる
  ■ URL: https://nakagiri3019-design.github.io/mail-app/（中桐）
          https://nakagiri3019-design.github.io/mail-app/noguchi/（野口）など
  ============================================================
-->

        body: '株式会社アークラボ 中桐由美子 様<br><br>お世話になっております。 合同会社駒商です。<br>株式会社Interakt様向け決算シミュレーター開発支援業務につきまして、 2026年5月分の請求書および作業報告書を添付にてお送りいたします。<br><br>今月は、決算書PDF読込機能、確認画面、修正入力機能、PDF出力機能、エラー表示・確認項目表示の調整を中心に対応いたしました。<br><br>内容をご確認いただき、不明点や修正点がございましたらご連絡ください。<br><br>何卒よろしくお願いいたします。<br><br>駒宮亮二',
        attachments: [
          { name: 'invoice_KOMA-202605.pdf', url: './invoice_KOMA-202605.pdf' },
          { name: 'workreport_202605.pdf', url: './workreport_202605.pdf' },
        ],
      },
    ],
  },
];

function initial(name) {
  return name.trim().charAt(0);
}

const AVATAR_LABEL_OVERRIDES = {
  '武田': '武田',
  '中桐': '中桐',
  '渡辺': '渡辺',
  '黒崎': '黒崎',
  '武田直弥': '武田',
  '駒宮亮二': '駒宮',
};

function avatarLabel(name) {
  return AVATAR_LABEL_OVERRIDES[name] || initial(name);
}

function formatDatetime(dt) {
  if (!dt || dt.includes('午前') || dt.includes('午後')) return dt;
  const m = dt.match(/(\d{4}年\d+月\d+日)[^0-9]*(\d+):(\d+)/);
  if (!m) return dt;
  const h = parseInt(m[2], 10);
  const min = m[3];
  const ampm = h < 12 ? '午前' : '午後';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${m[1]} ${ampm}${h12}:${min}`;
}

function renderDetailAvatar(name) {
  const label = avatarLabel(name);
  const fontSize = label.length > 1 ? 'font-size:11px;' : '';
  return `<div class="detail-avatar" style="background:${colorFor(name)};${fontSize}">${label}</div>`;
}

function starSVG(filled) {
  return filled
    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="#F4B400" stroke="#F4B400" stroke-width="1.5"><polygon points="12 2 15 9 22 9.3 16.7 14 18.5 21 12 17 5.5 21 7.3 14 2 9.3 9 9"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B6D55" stroke-width="1.8"><polygon points="12 2 15 9 22 9.3 16.7 14 18.5 21 12 17 5.5 21 7.3 14 2 9.3 9 9"/></svg>`;
}

function renderToLine(uid) {
  return `
    <div class="detail-to-line to-line-toggle" data-to-toggle="${uid}">
      <span>To: 自分</span><span class="to-arrow">▼</span>
    </div>
  `;
}

function renderToPanel(uid, from, fromEmail, toName, toEmail, datetime) {
  return `
    <div class="sender-detail-panel" data-to-panel="${uid}">
      <div class="panel-row"><span class="panel-label">From:</span><span>${from}・${fromEmail}</span></div>
      <div class="panel-row"><span class="panel-label">宛先:</span><span>${toName}・${toEmail}</span></div>
      <div class="panel-row"><span class="panel-label">日付:</span><span>${formatDatetime(datetime)}</span></div>
      <div class="security-notice">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#8B6D55" style="flex-shrink:0;margin-top:3px"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span>標準的な暗号化（TLS）が適用されています。<br><span class="security-link">セキュリティの詳細を表示</span></span>
      </div>
    </div>
  `;
}

function renderSenderCardIcons() {
  return `
    <div class="sender-card-icons">
      <button class="mini-icon-btn" aria-label="リアクション" onclick="alert('リアクションを送信（デモ）')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
      <button class="mini-icon-btn" aria-label="返信" onclick="alert('返信（デモ）')">↩</button>
      <button class="mini-icon-btn" aria-label="その他" onclick="alert('その他のオプション（デモ）')">⋮</button>
    </div>
  `;
}

function bindToPanelToggles(area) {
  area.querySelectorAll('[data-to-toggle]').forEach((toggle) => {
    toggle.addEventListener('click', () => {
      const id = toggle.getAttribute('data-to-toggle');
      const panel = area.querySelector(`[data-to-panel="${id}"]`);
      const arrow = toggle.querySelector('.to-arrow');
      const isOpen = panel.classList.toggle('open');
      arrow.textContent = isOpen ? '▲' : '▼';
    });
  });
}

function renderAttachment(att) {
  const action = att.url ? `window.open('${encodeURI(att.url)}', '_blank')` : `alert('添付ファイルを開く（デモ）')`;
  const previewHTML = att.noPreview ? '' : (() => {
    const preview = att.url
      ? `<canvas class="pdf-thumb-canvas" data-pdf-url="${att.url}"></canvas>`
      : `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D93025" stroke-width="1.5"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z" stroke-linejoin="round"/><path d="M14 3v5h5" stroke-linejoin="round"/></svg>`;
    return `<div class="attachment-preview">${preview}</div>`;
  })();
  return `
    <div class="attachment-card" onclick="${action}">
      ${previewHTML}
      <div class="attachment-info-bar">
        <svg class="attachment-icon-pdf" width="26" height="26" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="#D93025"/><text x="12" y="16" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">PDF</text></svg>
        <span class="attachment-file-name">${att.name}</span>
        <span class="attachment-actions">
          <svg class="attachment-action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <svg class="attachment-action-icon" width="18" height="18" viewBox="0 0 24 24"><path d="M8.5 2L1 14.5h6l7.5-12.5z" fill="currentColor"/><path d="M7 15.5l-3.5 6h14l3.5-6z" fill="currentColor"/><path d="M15.5 2L23 14.5h-7L9.5 2z" fill="currentColor"/></svg>
        </span>
      </div>
    </div>
  `;
}

function renderPdfThumbnails(area) {
  if (typeof pdfjsLib === 'undefined') return;
  area.querySelectorAll('canvas.pdf-thumb-canvas[data-pdf-url]').forEach((canvas) => {
    if (canvas.dataset.rendered) return;
    canvas.dataset.rendered = '1';
    const url = canvas.getAttribute('data-pdf-url');
    pdfjsLib.getDocument(url).promise
      .then((pdf) => pdf.getPage(1))
      .then((page) => {
        const containerWidth = canvas.parentElement.clientWidth;
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = containerWidth / baseViewport.width;
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        return page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      })
      .catch((err) => console.error('PDF preview render failed:', err));
  });
}

function renderList() {
  const list = document.getElementById('mail-list');
  list.innerHTML = MAILS.map((m) => `
    <div class="mail-row ${m.unread ? 'unread' : ''}" data-id="${m.id}">
      <div class="mail-avatar" style="background:${colorFor(m.name)};${(m.avatarLetter || initial(m.name)).length > 1 ? 'font-size:14px;' : ''}">${m.avatarLetter || initial(m.name)}</div>
      <div class="mail-body">
        <div class="mail-top-row">
          <span class="mail-sender">${m.name}</span>
          <span class="mail-date">${m.date}</span>
        </div>
        <div class="mail-subject-line"><span class="subj">${m.listSubject || m.subject}</span> <span class="mail-snippet">- ${m.snippet}</span></div>
      </div>
      <button class="star-btn" data-star="${m.id}">${starSVG(m.starred)}</button>
    </div>
  `).join('');

  list.querySelectorAll('.mail-row').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.star-btn')) return;
      openDetail(row.getAttribute('data-id'));
    });
  });
  list.querySelectorAll('.star-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-star');
      const mail = MAILS.find((x) => x.id === id);
      mail.starred = !mail.starred;
      btn.innerHTML = starSVG(mail.starred);
    });
  });
}

function previewText(body) {
  return body.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 60);
}

function renderQuoteBlock(prevMsg) {
  return `
    <div class="quote-block">
      <div class="quote-meta">On ${formatDatetime(prevMsg.datetime)}, ${prevMsg.from} wrote:</div>
      <span class="quote-link">元のメッセージを表示</span>
    </div>
  `;
}

function renderThreadCard(mail, msg, idx, expanded) {
  const uid = `${mail.id}-${idx}`;
  if (!expanded) {
    return `
      <div class="thread-card collapsed" data-card-toggle="${idx}">
        ${renderDetailAvatar(msg.from)}
        <div class="thread-card-collapsed-info">
          <span class="thread-card-name">${msg.from}</span>
          <span class="thread-card-date">${msg.date}</span>
          <div class="thread-card-preview">${previewText(msg.body)}</div>
        </div>
      </div>
    `;
  }
  const messages = mail._messages;
  const quoteHTML = idx > 0 ? renderQuoteBlock(messages[idx - 1]) : '';
  return `
    <div class="thread-card expanded">
      <div class="detail-meta-row" data-card-toggle="${idx}">
        ${renderDetailAvatar(msg.from)}
        <div class="detail-sender-info">
          <div class="detail-sender-name">${msg.from} <span class="thread-date-inline">${msg.date}</span></div>
          ${renderToLine(uid)}
        </div>
        ${renderSenderCardIcons()}
      </div>
      ${renderToPanel(uid, msg.from, msg.fromEmail, msg.to, msg.toEmail, msg.datetime)}
      <div class="detail-body-text">${msg.body}${(msg.attachments && msg.attachments.length) ? `<div class="attachment-grid">${msg.attachments.map(renderAttachment).join('')}</div>` : ''}</div>
      ${quoteHTML}
    </div>
  `;
}

function bindThreadCardToggles(area, mail) {
  area.querySelectorAll('[data-card-toggle]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-to-toggle]') || e.target.closest('.sender-card-icons') || e.target.closest('.detail-title-star')) return;
      const idx = Number(el.getAttribute('data-card-toggle'));
      const scrollPos = area.scrollTop;
      mail._expanded[idx] = !mail._expanded[idx];
      renderDetailBody(mail);
      area.scrollTop = scrollPos;
    });
  });
}

function renderDetailBody(mail) {
  const area = document.getElementById('detail-body-area');
  const messages = mail._messages;

  const subjectRowHTML = `
    <div class="detail-subject-block">
      <span class="detail-subject-text">${mail.subject}</span>
      <span class="inbox-badge">受信トレイ</span>
      <button class="detail-title-star" data-star="${mail.id}">${starSVG(mail.starred)}</button>
    </div>
  `;

  const cardsHTML = messages.map((msg, i) => renderThreadCard(mail, msg, i, mail._expanded[i])).join('');

  area.innerHTML = `${subjectRowHTML}${cardsHTML}`;

  bindToPanelToggles(area);
  bindThreadCardToggles(area, mail);
  renderPdfThumbnails(area);

  const titleStarBtn = area.querySelector('.detail-title-star');
  if (titleStarBtn) {
    titleStarBtn.addEventListener('click', () => {
      mail.starred = !mail.starred;
      titleStarBtn.innerHTML = starSVG(mail.starred);
    });
  }
}

function openDetail(id) {
  const mail = MAILS.find((x) => x.id === id);
  if (!mail) return;
  mail.unread = false;

  if (!mail._messages) {
    mail._messages = mail.thread || [{
      from: mail.name, fromEmail: mail.email, to: '中桐由美子', toEmail: MY_EMAIL,
      date: mail.date, datetime: mail.datetime || mail.date, body: mail.body,
    }];
  }
  if (!mail._expanded) {
    mail._expanded = mail._messages.map((_, i) => i === mail._messages.length - 1);
  }

  renderDetailBody(mail);
  document.getElementById('detail-body-area').scrollTop = 0;

  document.getElementById('inbox-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'flex';
  renderList();
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('inbox-view').style.display = 'flex';
  renderList();
}

renderList();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then((reg) => {
      reg.update();
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            window.location.reload();
          }
        });
      });
    }).catch((err) => {
      console.error('Service worker registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
